<?xml version='1.0' encoding='utf-8'?>
<svg:svg xmlns:svg="http://www.w3.org/2000/svg" width="2200" height="680" viewBox="0 0 2200 680" version="1.1">
  <svg:title>LIMINAL PROJECT | Primary horizontal logo</svg:title>
